# Linux checks on the production platform, linux/amd64 (STACK.md §3, §13).
# The workflow runs the mise tasks that a developer runs. It uses no
# repository secret, and its token can only read. The database tests use a
# PostgreSQL server on the runner.
name: ci

on:
  # Each job also skips a draft PR (the job conditions below): GitHub has no
  # draft filter for the trigger. A draft PR gets a run with skipped jobs.
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
  # A daily run of the vuln job only, so that a new advisory shows without
  # a push. GitHub runs a schedule on the default branch only.
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read

concurrency:
  # One group for each PR, and one group for each event and commit of main.
  # A new push to a PR cancels the old run of that PR. A push to main has a
  # group of its own, so no later push or schedule can cancel its run (also
  # not a pending run), and each commit of main keeps its evidence.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Selects image-check and vuln from the changed files of a PR
  # (scripts/ci-select.sh, STACK.md §3). A push to main and the schedule
  # select every job. A failed or skipped select job gives no output, and
  # each job that reads it then runs.
  select:
    name: select jobs
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      run_image_check: ${{ steps.select.outputs.run_image_check }}
      run_vuln: ${{ steps.select.outputs.run_vuln }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A PR run checks out the merge commit with the base. Its first
          # parent is the base, so the diff to it lists the changes of
          # the PR.
          fetch-depth: 2
          persist-credentials: false
      - id: select
        env:
          EVENT: ${{ github.event_name }}
        run: |
          changed="$RUNNER_TEMP/changed"
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only --no-renames HEAD^1 HEAD > "$changed" || rm -f "$changed"
            echo "Changed files:"; cat "$changed" || echo "(no list: every job runs)"
          fi
          scripts/ci-select.sh "$EVENT" "$changed" | tee -a "$GITHUB_OUTPUT"

  ci:
    name: mise run ci (linux/amd64)
    # Every non-draft PR and every push to main, also for a change of the
    # documents only: the job holds Gitleaks and the deployment tests.
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && !github.event.pull_request.draft)
    # A pinned image version, not ubuntu-latest, so that the platform
    # changes only with a change of this file.
    runs-on: ubuntu-26.04
    # The job also installs Chromium and its system packages.
    timeout-minutes: 60
    env:
      # The configuration is the checked-out repository; the run has no
      # secret, so a trusted mise.toml grants nothing more.
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      # PostgreSQL of the database tests: the major version of production,
      # pinned by tag and index digest (mise run deps checks both). The one
      # pin of the test server: the local server reads this line too
      # (scripts/test-postgres.sh).
      postgres_image: postgres:18.7-trixie@sha256:64c8b0d31e4ab6ea665e8426ea406a94bf52de3c05b3a4a8bf713704eefa9328
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Gitleaks scans the full history of the commit.
          fetch-depth: 0
          persist-credentials: false
      # Installs mise and the tools of mise.toml, and caches them.
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.14
      - name: mise run setup
        run: mise run setup
      # Sets TEST_DATABASE_URL for the next step.
      - name: Start PostgreSQL with TLS
        run: scripts/test-postgres.sh ci
      - name: mise run ci
        run: mise run ci

  vuln:
    # A separate job, so that a new image advisory does not hide the result
    # of the ci job (STACK.md §3, "Scope and gaps of vuln").
    name: mise run vuln
    needs: select
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && needs.select.outputs.run_vuln != 'false' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.14
      - name: mise run setup
        run: mise run setup
      - name: mise run vuln
        run: mise run vuln

  image-check:
    # Builds ingest/Dockerfile and webapp/Dockerfile with the Docker engine
    # of the hosted runner and checks the running containers (STACK.md §3,
    # task image-check). The job pushes nothing and uses no secret and no
    # database.
    name: mise run image-check (linux/amd64)
    needs: select
    if: ${{ !cancelled() && github.event_name != 'schedule' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && needs.select.outputs.run_image_check != 'false' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.14
      - name: mise run image-check
        run: mise run image-check
