# Linux checks on the production platform, linux/amd64 (STACK.md §3, §13).
# The workflow runs the mise tasks that a developer runs. It uses no
# repository secret and no database, and its token can only read.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A new push to a PR stops the old run of that PR. Each push to main keeps
  # its own run as evidence for that commit.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: mise run ci (linux/amd64)
    # A pinned image version, not ubuntu-latest, so that the platform
    # changes only with a change of this file.
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      # The configuration is the checked-out repository; the run has no
      # secret, so a trusted mise.toml grants nothing more.
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Gitleaks scans the full history of the commit.
          fetch-depth: 0
          persist-credentials: false
      # Installs mise and the tools of mise.toml, and caches them.
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.14
      - name: mise run setup
        run: mise run setup
      - name: mise run ci
        run: mise run ci

  vuln:
    # A separate job, so that a new image advisory does not hide the result
    # of the ci job (STACK.md §3, "Scope and gaps of vuln").
    name: mise run vuln
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.14
      - name: mise run setup
        run: mise run setup
      - name: mise run vuln
        run: mise run vuln
