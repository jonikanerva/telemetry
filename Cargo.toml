[workspace]
resolver = "3"
members = ["crates/domain", "crates/ingest", "crates/server"]

[workspace.package]
edition = "2024"
rust-version = "1.100"
publish = false

# Cargo.lock pins the exact resolved versions. The requirements below name
# the latest stable release at the time of the change (DOCTRINE.md P7).
[workspace.dependencies]
axum = { version = "0.8.9", default-features = false }
hyper = { version = "1.13.0", default-features = false, features = ["client", "http1", "server"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["service", "tokio"] }
serde_json ={ version = "1.0.154", default-features = false, features = ["std"] }
socket2 = { version = "0.6.5", default-features = false, features = ["all"] }
sqlx = { version = "0.9.1", default-features = false, features = ["json", "macros", "migrate", "postgres", "runtime-tokio", "tls-rustls-aws-lc-rs", "uuid"] }
jiff-sqlx = { version = "1.0.0", default-features = false, features = ["postgres"] }
thiserror = { version = "2.0.21", default-features = false, features = ["std"] }
tokio = { version = "1.54.1", default-features = false, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
futures-util = { version = "0.3.34", default-features = false }
getrandom = { version = "0.4.3", default-features = false }
jiff = { version = "1.0.3", default-features = false, features = ["std"] }
prost = { version = "0.14.6", default-features = false, features = ["derive", "std"] }
prost-types = { version = "0.14.6", default-features = false, features = ["std"] }
uuid = { version = "1.29.3", default-features = false, features = ["std"] }
zeromq = { version = "0.7.0", default-features = false, features = ["tcp-transport", "tokio-runtime"] }
# Build only: protobuf code generation without a protoc binary (ADR 0001).
prost-build = { version = "0.14.6", default-features = false }
protox = { version = "0.10.0", default-features = false }
# Tests only.
proptest = { version = "1.12.0", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
unfulfilled_lint_expectations = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
let_underscore_must_use = "deny"
