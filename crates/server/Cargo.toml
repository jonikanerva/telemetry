[package]
name = "telemetry-web-server"
version = "0.1.0"
description = "Web application server"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Test-only routes and the `serve-test` command for the browser tests, with
# TLS (rustls and tokio-rustls). The release image never enables this
# feature, so the release binary has no TLS code.
test-server = ["dep:rustls", "dep:tokio-rustls"]

# Features that only this crate uses: axum `json`, `matched-path`, and `query`,
# tower-http `catch-panic` and `fs`, and in the tests tower `util` and
# tokio `test-util`. The ingest build never resolves them. rustls has the
# one crypto provider of the workspace, aws-lc-rs (STACK.md §7), and no
# `logging` feature, so it writes no log record.
[dependencies]
axum = { workspace = true, features = ["json", "matched-path", "query"] }
getrandom.workspace = true
hyper.workspace = true
hyper-util.workspace = true
jiff.workspace = true
rustls = { workspace = true, optional = true, features = ["aws_lc_rs", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls = { workspace = true, optional = true }
tower-http = { workspace = true, features = ["catch-panic", "fs"] }
tracing.workspace = true
tracing-subscriber.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
