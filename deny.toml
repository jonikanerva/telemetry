# cargo-deny policy (STACK.md §14). Generated with `cargo deny init` from
# cargo-deny 0.22.1 and reduced to the settings that this project uses.
# Reference: https://embarkstudios.github.io/cargo-deny/checks/index.html

[graph]
# The production image runs on Linux. macOS is the development platform.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "aarch64-apple-darwin"]

[advisories]
# Vulnerabilities and unmaintained crates fail the check by default.
yanked = "deny"
ignore = []

[licenses]
# Each licence of the current dependency tree. Add a licence only after a
# review of the crate that needs it.
allow = ["Apache-2.0", "BSD-3-Clause", "MIT", "Unicode-3.0"]
confidence-threshold = 0.8

# foldhash has the Zlib licence, a permissive licence. Two versions are in
# the tree, and no feature turns either off:
# - 0.1: prost-build needs it through petgraph and hashbrown 0.15 (feature
#   `default-hasher`). It runs in the build script only.
# - 0.2: sqlx-core needs it through hashlink and hashbrown 0.16 (the cache
#   of prepared statements). It is part of the ingest binary.
# The exception covers this one crate, not the licence for every crate.
[[licenses.exceptions]]
crate = "foldhash"
allow = ["Zlib"]

# The TLS stack of the database connection (STACK.md §5 and §7): rustls
# with the aws-lc-rs provider and the Mozilla root certificates. sqlx
# feature `tls-rustls-aws-lc-rs` brings these crates; no feature removes
# them. ISC is a permissive licence of the MIT kind. aws-lc-sys has
# several terms; ISC is the one term that the allow list above does not
# already satisfy. Each exception covers one crate.
[[licenses.exceptions]]
crate = "aws-lc-rs"
allow = ["ISC"]

[[licenses.exceptions]]
crate = "aws-lc-sys"
allow = ["ISC"]

[[licenses.exceptions]]
crate = "rustls-webpki"
allow = ["ISC"]

[[licenses.exceptions]]
crate = "untrusted"
allow = ["ISC"]

# webpki-roots holds the Mozilla root certificates as data under the
# Community Data License Agreement, Permissive 2.0. The licence permits
# use and redistribution of the data without conditions on the program.
[[licenses.exceptions]]
crate = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

[licenses.private]
# The first-party crates are not published and have no licence.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = false

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
