# Reviewed ignore list for the image scan of tesla/fleet-telemetry
# (`mise run vuln`). Each entry records a decision of
# docs/security/image-advisories.md. Do not add an entry without a decision
# in that document. Do not add an entry for a "needs action" finding.
#
# One entry covers one alias group: osv-scanner also ignores the aliases of
# the ID (for example the GHSA ID of a GO ID).
# After `effectiveUntil`, an entry stops to apply and `vuln` fails again.
# Then repeat the triage and set a new date, or remove the entry.
# Format: https://google.github.io/osv-scanner/configuration/

# Debian 12 packages of the upstream image. The Dockerfile copies only the
# /fleet-telemetry binary from this image, and `mise run vuln` checks this.
# Do not widen the ecosystem to "Debian": that value also matches Debian 13.
[[PackageOverrides]]
ecosystem = "Debian:12"
vulnerability.ignore = true
effectiveUntil = 2027-02-24
reason = "Not in the production image: the Dockerfile copies only /fleet-telemetry. See docs/security/image-advisories.md#debian-12-packages-of-the-upstream-image"

# Go modules in /fleet-telemetry. Class names are defined in
# docs/security/image-advisories.md#decision-classes.

