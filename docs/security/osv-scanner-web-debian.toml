# Reviewed ignore list for the image scan of debian:trixie-slim as the
# runtime image of webapp/Dockerfile (`mise run vuln`). Each entry records
# a decision of docs/security/image-advisories.md#web-image for the web
# image. The ingest image has its own file,
# docs/security/osv-scanner-debian.toml. Do not add an entry without a
# decision in that section. Do not add an entry for a "needs action"
# finding.
#
# The entries have the IDs and the expiry dates of the ingest file; the web
# image does not extend an expiry. The service telemetry-web has a public
# domain (W4). The glibc and gcc-14 entries rest on the faulty function, not
# on the network exposure: the server does not load libstdc++ (W3) and does
# not import the faulty glibc functions (W5).
#
# The scan reads the FROM image, not the image that Railway builds. The
# Dockerfile runs `apt-get upgrade`, so an advisory with a fix in
# trixie-security is fixed in the built image, but the scan still shows it.
# After `effectiveUntil`, an entry stops to apply and `vuln` fails again.
# Then repeat the triage and set a new date, or remove the entry.
# Only advisories that Debian rates above "unimportant" are listed: the
# others do not fail the scan.

