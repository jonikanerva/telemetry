# Tool pins and the project commands (STACK.md §3).
# rust-toolchain.toml owns the Rust version. The setting below makes mise
# read that file, so that a global mise `rust` entry cannot replace it.

[settings]
idiomatic_version_file_enable_tools = ["rust"]

[tools]
cargo-nextest = "0.9.152"
cargo-deny = "0.22.1"
"github:Boshen/cargo-shear" = "1.14.1"
"cargo:sqlx-cli" = { version = "0.9.1", default-features = false, features = ["postgres", "rustls"], bin = "sqlx" }
gitleaks = "8.30.1"
osv-scanner = "2.7.1"
jq = "1.8.2"
crane = "0.22.1"

[tasks.setup]
description = "Install the pinned tools, the Rust toolchain, and the locked dependencies"
run = [
  # Name the tools: a plain `mise install` also installs the tools of the
  # global mise config. Keep this list equal to [tools].
  "mise install cargo-nextest cargo-deny github:Boshen/cargo-shear cargo:sqlx-cli gitleaks osv-scanner jq crane",
  "rustup toolchain install",
  "rustup show active-toolchain",
  "cargo fetch --locked",
  "echo 'setup: no test services are needed. The tests use no network and no database.'",
]

[tasks.format]
description = "Format the Rust code"
run = "cargo fmt --all"

[tasks.lint]
description = "Run Clippy with warnings as errors"
run = "cargo clippy --workspace --all-targets --locked -- -D warnings"

[tasks.build]
description = "Build the release binary with the locked dependencies"
run = "cargo build --workspace --release --locked"

[tasks.test]
description = "Run the tests and the doctests"
run = [
  "cargo nextest run --workspace --locked",
  "cargo test --doc --workspace --locked",
]

[tasks.verify]
description = "Run every required local check; stops at the first failure"
run = [
  "cargo fmt --all --check",
  { task = "lint" },
  "cargo deny --locked check",
  "cargo shear",
  "gitleaks git --redact --no-banner .",
  "jq empty config/server_config.json config/telemetry_config.json",
  "sh -n entrypoint.sh",
  "! git ls-files | grep -E '^(\\.env|secrets/|\\.bin/)'",
  { task = "build" },
  { task = "test" },
]

[tasks.deps]
description = "Dependency freshness check (STACK.md §3); reads crates.io and the Rust release channel"
run = [
  # `--verbose` lists each locked crate that is behind its latest crates.io
  # release, also across major versions: "Unchanged <crate> (available: <latest>)".
  "cargo update --dry-run --verbose",
  "mise outdated --bump --no-global",
  "echo \"pinned Rust: $(grep '^channel' rust-toolchain.toml)\"",
  "curl -fsS https://static.rust-lang.org/dist/channel-rust-stable.toml | grep -A1 '^\\[pkg.rust\\]'",
  # Images of the Dockerfile: the pinned FROM lines, the newest upstream
  # release tag, and the current Debian stable release. crane reads its
  # credentials from $DOCKER_CONFIG/config.json when that file exists. An
  # empty config.json in a temporary directory makes the read anonymous.
  "awk '/^FROM/ { print \"pinned image: \" $2 }' Dockerfile",
  # An unreadable tag list fails the task: a missing check is not a pass.
  "work=\"$(mktemp -d)\"; printf '{}' > \"$work/config.json\"; tag=\"$(DOCKER_CONFIG=\"$work\" crane ls tesla/fleet-telemetry | grep -E '^v[0-9]+[.][0-9]+[.][0-9]+$' | sort -V | tail -1)\"; rm -rf \"$work\"; test -n \"$tag\" || { echo 'deps: cannot read the tesla/fleet-telemetry tags'; exit 1; }; echo \"latest tesla/fleet-telemetry tag: $tag\"",
  "curl -fsS https://deb.debian.org/debian/dists/stable/Release | grep -E '^(Codename|Version):'",
]

[tasks.vuln]
description = "Vulnerability check (STACK.md §3): Rust dependencies and the FROM images of the Dockerfile"
# Runs every scan and fails when one scan fails or finds a vulnerability.
# crane downloads each FROM image for linux/amd64 as a Docker archive, so
# no container runtime is needed. crane reads its credentials from
# $DOCKER_CONFIG/config.json when that file exists. The task points
# DOCKER_CONFIG at a temporary directory with an empty config.json, so the
# pulls are anonymous and the local credential files are not read.
# Each image scan reads the reviewed ignore file
# docs/security/osv-scanner-<repository with / as ->.toml. The entries rely
# on premises of the Dockerfile and config/server_config.json
# (docs/security/image-advisories.md). The task checks these premises first
# and fails when one breaks, so that the triage is done again.
# The script is a TOML literal string: backslashes reach the shell as written.
run = '''
status=0
# Read the Dockerfile as instructions: drop comment lines and join
# continuation lines. Instruction names are compared without letter case.
dockerfile="$(awk '
  /^[[:space:]]*#/ { next }
  { line = line $0 }
  /\\$/ { sub(/\\$/, " ", line); next }
  { print line; line = "" }
  END { if (line != "") print line }
' Dockerfile)"
if printf '%s\n' "$dockerfile" | grep -qE '<<'; then
  echo "vuln: the Dockerfile has a heredoc; the premise check cannot read it"
  status=1
fi
if printf '%s\n' "$dockerfile" | grep -iE '^[[:space:]]*from[[:space:]]|from=' | grep -q '\$'; then
  echo "vuln: a FROM line or a from= source of the Dockerfile uses a variable"
  status=1
fi
other_sources="$(printf '%s\n' "$dockerfile" | grep -iE 'from=' | sed -E 's/[[:space:]]+/ /g; s/^ //; s/ $//' || true)"
if [ "$other_sources" != "COPY --from=upstream /fleet-telemetry /fleet-telemetry" ]; then
  echo "vuln: the only Dockerfile line with from= must copy /fleet-telemetry from the upstream image"
  status=1
fi
# Each FROM instruction names one image to scan.
images="$(printf '%s\n' "$dockerfile" | awk '
  toupper($1) == "FROM" { for (i = 2; i <= NF; i++) if ($i !~ /^--/) { print $i; break } }
')"
from_lines="$(grep -ciE '^[[:space:]]*from([[:space:]]|$)' Dockerfile || true)"
# The final stage must start from a base image: not from the upstream image
# and not from another stage. The check compares names without letter case.
final_base="$(printf '%s\n' "$dockerfile" | awk '
  toupper($1) == "FROM" {
    base = ""
    for (i = 2; i <= NF; i++) if ($i !~ /^--/) { base = tolower($i); break }
    for (i = 2; i < NF; i++) if (toupper($i) == "AS") stages[tolower($(i + 1))] = 1
    last = base
  }
  END { if (last in stages) print "stage:" last; else print last }
')"
case "$final_base" in
  ""|stage:*|*fleet-telemetry*)
    echo "vuln: the final Dockerfile stage must start from a base image, not from the upstream image or another stage"
    status=1
    ;;
esac
# fleet-telemetry decodes its config with Go encoding/json: keys match
# without letter case, a repeated key decodes again into the same field (a
# repeated object merges into the first one), and only the first JSON value
# of the file counts. jq is case sensitive and keeps only the last of two
# equal keys. So the check requires lowercase keys, exactly one JSON value,
# and the same leaf paths in the token stream and in the parsed value; a
# repeated key of any kind breaks the last rule.
config=config/server_config.json
if ! jq -e '
  def lower_keys: keys | all(test("^[a-z0-9_]+$"));
  lower_keys
  and ((.monitoring // {}) | lower_keys)
  and ((.tls // {}) | lower_keys)
  and ([(.records // {}) | .[][]] | all(. == "logger" or . == "zmq"))
  and ((.use_default_eng_ca // false) == false)
  and ((.tls.ca_file // "") == "")
  and ((.status_port // 0) == 0)
  and ((.monitoring.profiler_port // 0) == 0)
  and ((.monitoring.prometheus_metrics_host // "127.0.0.1") == "127.0.0.1")
' "$config" > /dev/null ||
  ! jq -s -e 'length == 1' "$config" > /dev/null ||
  [ "$(jq -n -c --stream '[inputs | select(length == 2) | .[0]] | sort' "$config")" != \
    "$(jq -c '[path(.. | select((type != "object" and type != "array") or length == 0))] | sort' "$config")" ]; then
  echo "vuln: $config breaks a premise of the ignore files (key case, one JSON value, repeated keys, dispatchers, client CAs, or listeners)"
  status=1
fi
cargo deny --locked check advisories || status=1
osv-scanner scan source -r . || status=1
work="$(mktemp -d)"
trap 'rm -rf "$work"' EXIT
printf '{}' > "$work/config.json"
export DOCKER_CONFIG="$work"
scanned=0
for image in $images; do
  echo "image: $image"
  if crane pull --platform linux/amd64 "$image" "$work/image.tar"; then
    crane digest --platform linux/amd64 "$image"
    ignore_file="docs/security/osv-scanner-$(printf '%s' "${image%%[:@]*}" | tr '/' '-').toml"
    if [ -f "$ignore_file" ]; then
      osv-scanner scan image --config "$ignore_file" --archive "$work/image.tar" || status=1
    else
      echo "vuln: no reviewed ignore file $ignore_file for $image"
      osv-scanner scan image --archive "$work/image.tar" || true
      status=1
    fi
    scanned=$((scanned + 1))
  else
    echo "vuln: cannot download $image"
    status=1
  fi
  rm -f "$work/image.tar"
done
if [ "$scanned" -ne "$from_lines" ]; then
  echo "vuln: scanned $scanned images, but the Dockerfile has $from_lines FROM lines"
  status=1
fi
exit "$status"
'''
