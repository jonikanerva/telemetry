# Tool pins and the project commands (STACK.md §3).
# rust-toolchain.toml owns the Rust version. The setting below makes mise
# read that file, so that a global mise `rust` entry cannot replace it.

[settings]
idiomatic_version_file_enable_tools = ["rust"]

[tools]
cargo-nextest = "0.9.152"
cargo-deny = "0.22.1"
"github:Boshen/cargo-shear" = "1.14.1"
# sqlx-cli installs two programs: `sqlx` and `cargo-sqlx`. `cargo sqlx
# prepare` (scripts/sqlx-metadata.sh) needs the second one.
"cargo:sqlx-cli" = { version = "0.9.1", default-features = false, features = ["postgres", "rustls"] }
gitleaks = "8.30.1"
osv-scanner = "2.7.1"
jq = "1.8.2"
crane = "0.22.1"
# The build-time runtime and the package manager of the SPA (STACK.md §1).
# Node is not a production requirement: the web image serves the built files.
node = "24.22.3"
pnpm = "12.23.0"

[tasks.setup]
description = "Install the pinned tools, the Rust toolchain, the locked dependencies, and the browsers of the tests"
run = [
  # Name the tools: a plain `mise install` also installs the tools of the
  # global mise config. Keep this list equal to [tools].
  "mise install cargo-nextest cargo-deny github:Boshen/cargo-shear cargo:sqlx-cli gitleaks osv-scanner jq crane node pnpm",
  # An install of sqlx-cli 0.9.1 from an older pin (`bin = "sqlx"`) has no
  # `cargo-sqlx`, and `mise install` keeps it because the version matches.
  # Reinstall only in that case, so that `cargo sqlx prepare` works.
  "mise which cargo-sqlx >/dev/null 2>&1 || mise install --force cargo:sqlx-cli@0.9.1",
  "rustup toolchain install",
  "rustup show active-toolchain",
  "cargo fetch --locked",
  "pnpm install --frozen-lockfile",
  # The browsers of the Playwright tests. In CI (GitHub sets CI=true), also
  # the system packages that the browsers need.
  "if [ \"${CI:-}\" = true ]; then pnpm exec playwright install --with-deps chromium firefox webkit; else pnpm exec playwright install chromium firefox webkit; fi",
  "echo 'setup: the database tests need TEST_DATABASE_URL, the URL of the Neon branch test (README.md, Verification).'",
]

[tasks.format]
description = "Format the Rust code and the TypeScript packages with their config files"
run = ["cargo fmt --all", "pnpm run format"]

[tasks.lint]
description = "Run Clippy, Oxlint, and the TypeScript compiler with warnings as errors for the host"
# The host is the platform that runs the command. The `ci` task runs on
# linux/amd64, the production platform (STACK.md §3). Clippy runs for the
# two supported feature sets: the default set and the test server.
run = [
  "cargo clippy --workspace --all-targets --locked -- -D warnings",
  "cargo clippy -p telemetry-web-server --all-targets --locked --features test-server -- -D warnings",
  "pnpm run lint",
  "pnpm run typecheck",
]

[tasks.build]
description = "Build the release binaries and the SPA, and check the bundle size"
# The SPA uses the committed client (packages/api-client/src/generated);
# the build does not export or generate it (`contract-check` compares it).
run = [
  "cargo build --workspace --release --locked",
  "pnpm run build:web",
  "pnpm run bundle-size",
]

[tasks.contract]
description = "Export contract/openapi.json from the server and generate the API client from it"
run = [
  "cargo run --quiet --locked -p telemetry-web-server -- export-openapi contract/openapi.json",
  "pnpm --filter telemetry-web-api-client run generate -- --input ../../contract/openapi.json --output src/generated",
]

[tasks.contract-check]
description = "Check that the committed contract and client equal a new export and generation"
run = "scripts/contract-check.sh"

[tasks.test]
description = "Run all tests and the doctests; the database tests need TEST_DATABASE_URL"
run = [
  # A missing URL is a failure, not a skipped check (STACK.md §3).
  "test -n \"${TEST_DATABASE_URL:-}\" || { echo 'test: TEST_DATABASE_URL is not set. Export the URL of the Neon branch test (README.md, Verification).' >&2; exit 1; }",
  "cargo nextest run --workspace --locked",
  "cargo nextest run -p telemetry-web-server --locked --features test-server",
  { task = "doctest" },
  { task = "test-web" },
]

[tasks.test-web]
description = "Run the Vitest tests and the Playwright journeys against the test server with the built SPA"
hide = true
run = [
  "pnpm run test:unit",
  # The journeys need the test server binary and the built SPA (web/dist).
  "cargo build --locked -p telemetry-web-server --features test-server",
  "pnpm run build:web",
  "pnpm run test:e2e",
]

[tasks.test-ci]
description = "Run the tests of CI against the PostgreSQL server of the runner, and the doctests"
# Only the `ci` task uses this task; `verify` uses `test`, which runs all
# tests against the Neon branch `test`. scripts/ci-postgres.sh sets
# TEST_DATABASE_URL. The filter excludes the database tests that need Neon
# (STACK.md §3): the end-to-end tests of `tests/storage/pipeline.rs` (the
# binary trusts only the Mozilla roots, not the test CA), and the two role
# tests that read the membership of the Neon role `neon_superuser`.
run = [
  "test -n \"${TEST_DATABASE_URL:-}\" || { echo 'test-ci: TEST_DATABASE_URL is not set. In CI, scripts/ci-postgres.sh sets it.' >&2; exit 1; }",
  "cargo nextest run --workspace --locked --no-fail-fast -E 'not (binary_id(ingest::storage) and (test(/^pipeline::/) or test(=roles::the_roles_get_the_privileges_of_adr_0002) or test(=roles::the_role_script_is_idempotent)))'",
  "cargo nextest run -p telemetry-web-server --locked --no-fail-fast --features test-server",
  { task = "doctest" },
  { task = "test-web" },
]

[tasks.doctest]
description = "Run the doctests"
hide = true
run = "cargo test --doc --workspace --locked"

[tasks.checks]
description = "Run the static checks that verify and ci share"
hide = true
run = [
  "cargo fmt --all --check",
  "pnpm run format:check",
  { task = "lint" },
  { task = "contract-check" },
  "cargo deny --locked check",
  # The JS dependencies, also the development tools (STACK.md §3, §14).
  "pnpm audit --prod=false",
  "cargo shear",
  "gitleaks git --redact --no-banner .",
  "jq empty ingest/server_config.json config/telemetry_config.json contract/openapi.json",
  "sh -n ingest/entrypoint.sh",
  "sh -n scripts/sqlx-metadata.sh",
  "sh -n scripts/image-check.sh",
  "sh -n scripts/image-check-web.sh",
  "sh -n scripts/contract-check.sh",
  "sh -n scripts/bundle-size.sh",
  "sh -n e2e/tls-cert.sh",
  "! git ls-files | grep -E '(^|/)(\\.env|secrets/|\\.bin/|node_modules/)'",
]

[tasks.sqlx-check]
description = "Check the committed SQLx query metadata against a migrated, isolated test database"
run = "scripts/sqlx-metadata.sh check"

[tasks.sqlx-prepare]
description = "Write the SQLx query metadata in crates/<crate>/.sqlx/ after a query or migration change"
run = "scripts/sqlx-metadata.sh prepare"

[tasks.verify]
description = "Run every required local check; stops at the first failure"
run = [
  "test -n \"${TEST_DATABASE_URL:-}\" || { echo 'verify: TEST_DATABASE_URL is not set. Export the URL of the Neon branch test (README.md, Verification).' >&2; exit 1; }",
  { task = "checks" },
  { task = "sqlx-check" },
  { task = "build" },
  { task = "test" },
]

[tasks.ci]
description = "Run the checks of the GitHub Actions workflow; stops at the first failure"
# The same checks as `verify`, against the PostgreSQL server of the runner
# instead of Neon, without the tests that need Neon (STACK.md §3). `ci`
# does not replace the local `verify`.
run = [
  { task = "checks" },
  { task = "sqlx-check" },
  { task = "build" },
  { task = "test-ci" },
]

[tasks.image-check]
description = "Build the ingest image and the web image and check each running container (needs Docker; the CI job image-check runs it)"
# STACK.md §3. The development machine has no container runtime, so this
# task runs in CI on linux/amd64. It pushes no image and uses no secret.
# Each script has its own containers, ports, and cleanup. The task stops
# at the first failure.
run = ["scripts/image-check.sh", "scripts/image-check-web.sh"]

[tasks.deps]
description = "Dependency freshness check (STACK.md §3); reads crates.io, the Rust release channel, the image tags, and the tags of the CI pins"
run = [
  # `--verbose` lists each locked crate that is behind its latest crates.io
  # release, also across major versions: "Unchanged <crate> (available: <latest>)".
  "cargo update --dry-run --verbose",
  "mise outdated --bump --no-global",
  "echo \"pinned Rust: $(grep '^channel' rust-toolchain.toml)\"",
  "curl -fsS https://static.rust-lang.org/dist/channel-rust-stable.toml | grep -A1 '^\\[pkg.rust\\]'",
  # Images of ingest/Dockerfile: the pinned FROM lines, the newest upstream
  # release tag, the newest Rust builder tag on the Debian release of the
  # final stage, and the current Debian stable release. crane reads its
  # credentials from $DOCKER_CONFIG/config.json when that file exists. An
  # empty config.json in a temporary directory makes the read anonymous.
  "awk '/^FROM/ { print \"pinned image: \" $2 }' ingest/Dockerfile",
  # An unreadable tag list fails the task: a missing check is not a pass.
  "work=\"$(mktemp -d)\"; printf '{}' > \"$work/config.json\"; tag=\"$(DOCKER_CONFIG=\"$work\" crane ls tesla/fleet-telemetry | grep -E '^v[0-9]+[.][0-9]+[.][0-9]+$' | sort -V | tail -1)\"; rm -rf \"$work\"; test -n \"$tag\" || { echo 'deps: cannot read the tesla/fleet-telemetry tags'; exit 1; }; echo \"latest tesla/fleet-telemetry tag: $tag\"",
  # The builder tag is <Rust version>-slim-<Debian codename>.
  "codename=\"$(sed -n 's/^FROM debian:\\([a-z]*\\).*$/\\1/p' ingest/Dockerfile)\"; test -n \"$codename\" || { echo 'deps: cannot read the Debian codename of ingest/Dockerfile'; exit 1; }; work=\"$(mktemp -d)\"; printf '{}' > \"$work/config.json\"; tag=\"$(DOCKER_CONFIG=\"$work\" crane ls rust | grep -E \"^[0-9]+[.][0-9]+[.][0-9]+-slim-$codename\\$\" | sort -V | tail -1)\"; rm -rf \"$work\"; test -n \"$tag\" || { echo 'deps: cannot read the rust image tags'; exit 1; }; echo \"latest rust builder tag: $tag\"",
  # The web image and the JS tools: the pinned FROM lines of
  # webapp/Dockerfile, the newest node builder tag of the pinned Node major
  # on the Debian release of the final stage, the newest Node LTS release,
  # the newest pnpm release, and the locked JS packages that are behind
  # their latest release. The rust builder tag of webapp/Dockerfile is the
  # same as for ingest/Dockerfile (crates/server/tests/deployment.rs). The
  # deps task, like `cargo update --dry-run`, does not apply the minimum
  # release age: a release younger than 1440 minutes is not due.
  '''
  dockerfile=webapp/Dockerfile
  awk '/^FROM/ { print "pinned image: " $2 }' "$dockerfile"
  node_pin="$(awk -F'"' '/^node = / { print $2 }' mise.toml)"
  pnpm_pin="$(awk -F'"' '/^pnpm = / { print $2 }' mise.toml)"
  codename="$(sed -n 's/^FROM debian:\([a-z]*\)-slim$/\1/p' "$dockerfile")"
  if [ -z "$node_pin" ] || [ -z "$pnpm_pin" ] || [ -z "$codename" ]; then
    echo "deps: cannot read the Node or pnpm pin of mise.toml or the Debian codename of $dockerfile"; exit 1
  fi
  major="${node_pin%%.*}"
  work="$(mktemp -d)"; printf '{}' > "$work/config.json"
  tag="$(DOCKER_CONFIG="$work" crane ls node | grep -E "^$major[.][0-9]+[.][0-9]+-$codename-slim\$" | sort -V | tail -1)"
  rm -rf "$work"
  [ -n "$tag" ] || { echo "deps: cannot read the node image tags"; exit 1; }
  echo "pinned Node: $node_pin; latest node builder tag of Node $major: $tag"
  lts="$(curl -fsS https://nodejs.org/dist/index.json | jq -r '[.[] | select(.lts != false)][0] | "\(.version) (\(.lts))"')"
  [ -n "$lts" ] || { echo "deps: cannot read the Node releases"; exit 1; }
  echo "newest Node LTS release: $lts"
  pnpm_latest="$(curl -fsS https://registry.npmjs.org/pnpm/latest | jq -r '.version')"
  [ -n "$pnpm_latest" ] || { echo "deps: cannot read the newest pnpm release"; exit 1; }
  echo "pinned pnpm: $pnpm_pin; latest pnpm release: $pnpm_latest"
  # pnpm outdated exits with 1 when a package is behind. The JSON form
  # tells that result from a failed read: a read gives one JSON object.
  outdated="$(pnpm outdated --recursive --format json)" || true
  printf '%s\n' "$outdated" | jq -e 'type == "object"' > /dev/null ||
    { echo "deps: cannot read the outdated JS packages (pnpm outdated)"; exit 1; }
  printf '%s\n' "$outdated" | jq -r 'to_entries[] | "outdated JS package: \(.key) \(.value.current) (latest: \(.value.latest), \(.value.dependencyType))"'
  ''',
  "curl -fsS https://deb.debian.org/debian/dists/stable/Release | grep -E '^(Codename|Version):'",
  # Pins of the CI workflow (STACK.md §15): each action, the mise version,
  # and the runner label, with the newest release tags. git ls-remote reads
  # the public tags; no token is needed. The step fails when it cannot read a tag
  # list, or when an action SHA is not the commit of its tag comment.
  # The workflow check is a strict allowlist, not a YAML parser:
  # - `.github/` holds only `workflows/` and `pull_request_template.md`,
  #   and `.github/workflows/` holds only `ci.yml`. A new workflow file or
  #   a new directory (for example a composite action in
  #   `.github/actions/`) fails. Extend this check in the same PR.
  # - In `ci.yml`, each line with a `uses`, `version`, or `runs-on` key
  #   must have the one allowed form. The only allowed image is the
  #   PostgreSQL image of the database tests: one `postgres_image` line
  #   with a PostgreSQL 18 tag and an index digest, which must be the
  #   digest of that tag. Any other line with a `container`, `services`,
  #   or `image` key fails. Each mise action step must have a `version`
  #   input, each job must have one `runs-on`, and YAML anchors and
  #   aliases are not allowed.
  # Anything else fails, and the check must change together with the
  # workflow. Limits: STACK.md §3, "Dependency freshness check".
  '''
  workflow=.github/workflows/ci.yml
  export GIT_TERMINAL_PROMPT=0
  status=0
  fix="Update the CI pin step of the deps task (mise.toml) together with the workflow."
  tags() { git ls-remote --tags "https://github.com/$1"; }
  newest() { sed -n 's#^[0-9a-f]*[[:space:]]refs/tags/\(v[0-9]*[.][0-9]*[.][0-9]*\)$#\1#p' | sort -V | tail -1; }
  [ -f "$workflow" ] || { echo "deps: $workflow is missing"; exit 1; }
  # Only the known entries in .github/ and .github/workflows/.
  extra="$(find .github -mindepth 1 -maxdepth 1 ! -name workflows ! -name pull_request_template.md; find .github/workflows -mindepth 1 ! -path "$workflow")"
  if [ -n "$extra" ]; then
    printf '%s\n' "$extra" | while IFS= read -r entry; do
      echo "deps: unexpected entry $entry"
    done
    echo "deps: .github/ may hold only workflows/ci.yml and pull_request_template.md. GitHub runs every workflow file in .github/workflows/, and the CI pin check reads only $workflow. Extend the CI pin step of the deps task (mise.toml) in the same PR as a new workflow file, action, or other entry."
    status=1
  fi
  uses_form=' +- uses: [a-z0-9-]+/[a-z0-9._-]+@[0-9a-f]{40} # v[0-9]+[.][0-9]+[.][0-9]+'
  version_form=' +version: [0-9]+[.][0-9]+[.][0-9]+'
  runs_form=' +runs-on: ubuntu-[0-9]+[.]04'
  postgres_form=' +postgres_image: postgres:18[.][0-9]+-[a-z]+@sha256:[0-9a-f]{64}'
  # Every line with one of the keys (also quoted, also without "- ") and
  # every anchor or alias must be an allowed line. The keys container and
  # services have no allowed form; an image key only the postgres_image form.
  bad="$(grep -nE '(uses|version|runs-on|container|services|image).?[[:space:]]*:|^[^#]*[&*][A-Za-z0-9_-]' "$workflow" |
    grep -vE "^[0-9]+:($uses_form|$version_form|$runs_form|$postgres_form)$" | sed 's/^\([0-9]*\):/\1: /' || true)"
  if [ -n "$bad" ]; then
    printf '%s\n' "$bad" | while IFS= read -r line; do
      echo "deps: $workflow line $line"
    done
    echo "deps: the lines above are outside the allowlist. Allowed: '- uses: <owner>/<repo>@<40 lowercase hex> # vX.Y.Z' (a full release tag), 'version: X.Y.Z' (the mise action input), 'runs-on: ubuntu-NN.04', and 'postgres_image: postgres:18.N-<variant>@sha256:<64 lowercase hex>'. No container or services key and no other image key is allowed. $fix"
    status=1
  fi
  # Each mise action step: the next two lines are "with:" and "version:".
  if ! awk '
    want && NR == want + 1 && $0 !~ /^ +with:$/ { bad = 1 }
    want && NR == want + 2 { if ($0 !~ /^ +version: /) bad = 1; want = 0 }
    /^ +- uses: jdx\/mise-action@/ { want = NR; steps++ }
    /^ +version: / { versions++ }
    END { exit (bad || want || steps == 0 || versions != steps) }' "$workflow"; then
    echo "deps: each jdx/mise-action step of $workflow needs 'with:' and 'version: X.Y.Z' on the next two lines, and no other 'version:' line may exist. $fix"
    status=1
  fi
  # Each job has exactly one runs-on line.
  jobs="$(awk '/^jobs:$/ { j = 1; next } j && /^[^ #]/ { j = 0 } j && /^  [A-Za-z0-9_-]+:$/ { n++ } END { print n + 0 }' "$workflow")"
  runs="$(grep -cE "^$runs_form$" "$workflow" || true)"
  if [ "$jobs" -eq 0 ] || [ "$runs" -ne "$jobs" ]; then
    echo "deps: $workflow has $jobs jobs and $runs allowed runs-on lines; each job needs one. $fix"
    status=1
  fi
  pins="$(sed -n 's/^ *- uses: \([^ ]*@[0-9a-f]\{40\}\) # \(v[0-9.]*\)$/\1#\2/p' "$workflow" | sort -u)"
  [ -n "$pins" ] || { echo "deps: no pinned action in $workflow"; status=1; }
  for pin in $pins; do
    ref="${pin%%#*}"; tag="${pin#*#}"
    repo="${ref%@*}"; sha="${ref#*@}"
    list="$(tags "$repo")" || list=""
    latest="$(printf '%s\n' "$list" | newest)"
    # An annotated tag has a ^{} line with the commit; a lightweight tag has none.
    tag_sha="$(printf '%s\n' "$list" | awk -v t="refs/tags/$tag" '$2 == t "^{}" { c = $1 } $2 == t && c == "" { l = $1 } END { print (c != "" ? c : l) }')"
    if [ -z "$latest" ] || [ -z "$tag_sha" ]; then
      echo "deps: cannot read the tags of $repo"; status=1; continue
    fi
    echo "pinned action: $repo $tag ($sha); latest tag: $latest"
    [ "$tag_sha" = "$sha" ] || { echo "deps: $repo pins $sha, but $tag is $tag_sha"; status=1; }
  done
  mise_pin="$(sed -n 's/^ *version: \([0-9.]*\)$/\1/p' "$workflow" | sort -u)"
  mise_latest="$(tags jdx/mise | newest)"
  if [ -z "$mise_latest" ] || [ "$(printf '%s\n' "$mise_pin" | grep -c .)" -ne 1 ]; then
    echo "deps: cannot read the mise pin of $workflow or the mise tags"; status=1
  else
    echo "pinned CI mise: $mise_pin; latest tag: ${mise_latest#v}"
  fi
  # The PostgreSQL image of the database tests: exactly one pin, and its
  # digest must be the index digest of its tag. crane reads anonymously
  # (an empty config.json, as for the images of ingest/Dockerfile).
  if [ "$(grep -cE "^$postgres_form$" "$workflow" || true)" -ne 1 ]; then
    echo "deps: $workflow needs exactly one postgres_image line. $fix"
    status=1
  else
    pg="$(sed -n 's/^ *postgres_image: postgres:\(.*\)$/\1/p' "$workflow")"
    pg_tag="${pg%@*}"; pg_digest="${pg#*@}"
    work="$(mktemp -d)"; printf '{}' > "$work/config.json"
    pg_latest="$(DOCKER_CONFIG="$work" crane ls postgres | grep -E "^18[.][0-9]+-${pg_tag#*-}\$" | sort -V | tail -1)"
    pg_tag_digest="$(DOCKER_CONFIG="$work" crane digest "postgres:$pg_tag" || true)"
    rm -rf "$work"
    if [ -z "$pg_latest" ] || [ -z "$pg_tag_digest" ]; then
      echo "deps: cannot read the postgres image tags or the digest of postgres:$pg_tag"; status=1
    else
      echo "pinned CI postgres image: postgres:$pg_tag ($pg_digest); latest PostgreSQL 18 tag: $pg_latest"
      [ "$pg_tag_digest" = "$pg_digest" ] || { echo "deps: postgres_image pins $pg_digest, but postgres:$pg_tag is $pg_tag_digest"; status=1; }
    fi
  fi
  runners="$(sed -n 's/^ *runs-on: //p' "$workflow" | sort -u | paste -sd ' ' -)"
  ubuntu="$(tags actions/runner-images | sed -n 's#.*refs/tags/ubuntu\([0-9][0-9]\)/.*#\1#p' | sort -n | tail -1)"
  if [ -z "$ubuntu" ]; then
    echo "deps: cannot read the runner image tags"; status=1
  else
    echo "pinned CI runner: $runners; newest Ubuntu runner image with a tag: $ubuntu.04 (check its status in the runner-images README)"
  fi
  exit "$status"
  ''',
]

[tasks.vuln]
description = "Vulnerability check (STACK.md §3): Rust and JS dependencies and the runtime FROM images of ingest/Dockerfile and webapp/Dockerfile"
# Runs every scan and fails when one scan fails or finds a vulnerability.
# The source scan reads Cargo.lock and pnpm-lock.yaml; it skips the
# workspace links of pnpm-lock.yaml, so the first-party package names get
# no advisory, and it skips the git-ignored node_modules/. pnpm audit
# reads every JS dependency, also the development tools.
# crane downloads each runtime FROM image for linux/amd64 as a Docker
# archive, so no container runtime is needed. crane reads its credentials
# from $DOCKER_CONFIG/config.json when that file exists. The task points
# DOCKER_CONFIG at a temporary directory with an empty config.json, so the
# pulls are anonymous and the local credential files are not read.
# Each image scan reads the reviewed ignore file
# docs/security/osv-scanner-<repository with / as ->.toml. Some entries rely
# on deployment facts (docs/security/image-advisories.md, "Deployment
# facts"). crates/ingest/tests/deployment.rs checks most of them. The task
# checks the three facts that no other check holds, and fails when one
# breaks, so that the triage is done again. For the web image, it checks
# the copies between stages (docs/security/image-advisories.md, "Web
# image").
# The builder images are not scanned: ingest/Dockerfile stage build and
# webapp/Dockerfile stages web and build. No file of them reaches a final
# image except the binary and the SPA files (STACK.md §13).
# Each Dockerfile has its own number of runtime FROM images. Both final
# stages use the same debian image; the task scans each image once, and
# counts each scanned image for each Dockerfile that names it.
# The script is a TOML literal string: backslashes reach the shell as written.
run = '''
status=0
dockerfile=ingest/Dockerfile
# Fact 1: the final image takes only /fleet-telemetry from the upstream
# image (and the ingest binary from the build stage).
copies="$(grep -iE 'from=' "$dockerfile" | grep -vE '^[[:space:]]*#' || true)"
if [ "$copies" != "$(printf '%s\n' 'COPY --from=upstream /fleet-telemetry /fleet-telemetry' 'COPY --from=build /build/target/release/ingest /usr/local/bin/ingest')" ]; then
  echo "vuln: $dockerfile copies other files between stages. Repeat the triage of docs/security/image-advisories.md."
  status=1
fi
# The web image takes only the server binary from the build stage and the
# SPA files from the web stage (image-advisories.md, "Web image").
web_dockerfile=webapp/Dockerfile
copies="$(grep -iE 'from=' "$web_dockerfile" | grep -vE '^[[:space:]]*#' || true)"
if [ "$copies" != "$(printf '%s\n' 'COPY --from=build /build/target/release/telemetry-web-server /usr/local/bin/telemetry-web-server' 'COPY --from=web /build/web/dist /usr/local/share/telemetry-web')" ]; then
  echo "vuln: $web_dockerfile copies other files between stages. Repeat the triage of docs/security/image-advisories.md, \"Web image\"."
  status=1
fi
# The entrypoint runs rm, chown, and setpriv as root and nothing else
# (image-advisories.md, "Debian 13 base"). The pin is the git blob ID of
# the file. Repeat that split and update the pin when the file changes.
if [ "$(git hash-object ingest/entrypoint.sh)" != 9756457071506c4cf76ec0634d8ce6844410b854 ]; then
  echo "vuln: ingest/entrypoint.sh changed. Repeat the entrypoint split of docs/security/image-advisories.md and update the pin in the vuln task."
  status=1
fi
# Facts 3, 6, and 8: fleet-telemetry decodes its config with Go
# encoding/json, which matches keys without letter case, merges a repeated
# object into the first one, and reads only the first JSON value. The
# deployment test reads the file with serde_json, which keeps the last
# repeated key. So: one JSON value, no repeated key (the leaf paths of the
# token stream equal those of the parsed value), lowercase keys outside the
# record type names, only the Tesla production CA, no status server, and
# no profiler.
if ! jq -n -e --stream '
  [inputs] as $events
  | [fromstream($events[])] as $values
  | ($values | length) == 1
  and ($values[0] as $c
    | ([$events[] | select(length == 2) | .[0]] | sort)
      == ([$c | path(.. | select((type != "object" and type != "array") or length == 0))] | sort)
    and ([$c | paths | select(.[0] != "records" or length == 1) | .[-1] | strings] | all(test("^[a-z0-9_]+$")))
    and (($c.use_default_eng_ca // false) == false)
    and (($c.tls.ca_file // "") == "")
    and (($c.status_port // 0) == 0)
    and (($c.monitoring.profiler_port // 0) == 0))
' ingest/server_config.json > /dev/null; then
  echo "vuln: ingest/server_config.json breaks a deployment fact of the ignore files (one JSON value, repeated or uppercase keys, client CAs, status port, or profiler)"
  status=1
fi
cargo deny --locked check advisories || status=1
pnpm audit --prod=false || status=1
# .claude/ holds old agent worktrees with their own Cargo.lock files.
osv-scanner scan source -r --x-exclude 'g:**/.claude/worktrees' . || status=1
work="$(mktemp -d)"
trap 'rm -rf "$work"' EXIT
printf '{}' > "$work/config.json"
export DOCKER_CONFIG="$work"
# The runtime FROM images of each Dockerfile: every stage except its
# builder stages. Each line: the Dockerfile, its builder stages (with
# commas), and its number of runtime images. ingest/Dockerfile has two
# (tesla/fleet-telemetry and debian), webapp/Dockerfile has one (debian).
cat > "$work/specs" <<'EOF'
ingest/Dockerfile build 2
webapp/Dockerfile web,build 1
EOF
# One line for each runtime FROM line: the Dockerfile and the image.
: > "$work/runtime"
while read -r file builders expected; do
  awk -v f="$file" -v b=",$builders," 'toupper($1) == "FROM" && !(toupper($3) == "AS" && index(b, "," $4 ",")) { print f, $2 }' "$file" >> "$work/runtime"
done < "$work/specs"
# Each image once, also when both Dockerfiles name it.
: > "$work/scanned"
for image in $(cut -d ' ' -f 2 "$work/runtime" | sort -u); do
  echo "image: $image ($(awk -v i="$image" '$2 == i { printf "%s ", $1 }' "$work/runtime"))"
  if crane pull --platform linux/amd64 "$image" "$work/image.tar"; then
    crane digest --platform linux/amd64 "$image"
    ignore_file="docs/security/osv-scanner-$(printf '%s' "${image%%[:@]*}" | tr '/' '-').toml"
    if [ -f "$ignore_file" ]; then
      osv-scanner scan image --config "$ignore_file" --archive "$work/image.tar" || status=1
    else
      echo "vuln: no reviewed ignore file $ignore_file for $image"
      osv-scanner scan image --archive "$work/image.tar" || true
      status=1
    fi
    echo "$image" >> "$work/scanned"
  else
    echo "vuln: cannot download $image"
    status=1
  fi
  rm -f "$work/image.tar"
done
# Each Dockerfile: the number of its runtime FROM lines and the number of
# those that the loop scanned must both equal the expected number.
while read -r file builders expected; do
  listed="$(awk -v f="$file" '$1 == f { n++ } END { print n + 0 }' "$work/runtime")"
  scanned="$(awk -v f="$file" 'NR == FNR { ok[$1] = 1; next } $1 == f && ($2 in ok) { n++ } END { print n + 0 }' "$work/scanned" "$work/runtime")"
  echo "runtime images of $file: $listed listed, $scanned scanned, $expected expected"
  if [ "$listed" -ne "$expected" ] || [ "$scanned" -ne "$expected" ]; then
    echo "vuln: scanned $scanned of $listed runtime images of $file, expected $expected"
    status=1
  fi
done < "$work/specs"
exit "$status"
'''
