# Tool pins and the project commands (STACK.md §3).
# rust-toolchain.toml owns the Rust version. The setting below makes mise
# read that file, so that a global mise `rust` entry cannot replace it.

[settings]
idiomatic_version_file_enable_tools = ["rust"]

[tools]
cargo-nextest = "0.9.152"
cargo-deny = "0.22.1"
"github:Boshen/cargo-shear" = "1.14.1"
# sqlx-cli installs two programs: `sqlx` and `cargo-sqlx`. `cargo sqlx
# prepare` (scripts/sqlx-metadata.sh) needs the second one.
"cargo:sqlx-cli" = { version = "0.9.1", default-features = false, features = ["postgres", "rustls"] }
gitleaks = "8.30.1"
osv-scanner = "2.7.1"
jq = "1.8.2"
crane = "0.22.1"

[tasks.setup]
description = "Install the pinned tools, the Rust toolchain, and the locked dependencies"
run = [
  # Name the tools: a plain `mise install` also installs the tools of the
  # global mise config. Keep this list equal to [tools].
  "mise install cargo-nextest cargo-deny github:Boshen/cargo-shear cargo:sqlx-cli gitleaks osv-scanner jq crane",
  # An install of sqlx-cli 0.9.1 from an older pin (`bin = "sqlx"`) has no
  # `cargo-sqlx`, and `mise install` keeps it because the version matches.
  # Reinstall only in that case, so that `cargo sqlx prepare` works.
  "mise which cargo-sqlx >/dev/null 2>&1 || mise install --force cargo:sqlx-cli@0.9.1",
  "rustup toolchain install",
  "rustup show active-toolchain",
  "cargo fetch --locked",
  "echo 'setup: the database tests need TEST_DATABASE_URL, the URL of the Neon branch test (README.md, Verification).'",
]

[tasks.format]
description = "Format the Rust code"
run = "cargo fmt --all"

[tasks.lint]
description = "Run Clippy with warnings as errors for the host"
# The host is the platform that runs the command. The `ci` task runs on
# linux/amd64, the production platform (STACK.md §3).
run = "cargo clippy --workspace --all-targets --locked -- -D warnings"

[tasks.build]
description = "Build the release binary with the locked dependencies"
run = "cargo build --workspace --release --locked"

[tasks.test]
description = "Run all tests and the doctests; the database tests need TEST_DATABASE_URL"
run = [
  # A missing URL is a failure, not a skipped check (STACK.md §3).
  "test -n \"${TEST_DATABASE_URL:-}\" || { echo 'test: TEST_DATABASE_URL is not set. Export the URL of the Neon branch test (README.md, Verification).' >&2; exit 1; }",
  "cargo nextest run --workspace --locked",
  { task = "doctest" },
]

[tasks.test-without-database]
description = "Run the tests that need no database, and the doctests (for CI)"
# CI has no database (STACK.md §3). Only the `ci` task uses this task;
# `verify` uses `test`, which runs all tests. The filter excludes the
# database tests: the test binary `storage` (`crates/ingest/tests/storage/`).
run = [
  "cargo nextest run --workspace --locked -E 'not binary_id(ingest::storage)'",
  { task = "doctest" },
]

[tasks.doctest]
description = "Run the doctests"
hide = true
run = "cargo test --doc --workspace --locked"

[tasks.checks]
description = "Run the static checks that verify and ci share"
hide = true
run = [
  "cargo fmt --all --check",
  { task = "lint" },
  "cargo deny --locked check",
  "cargo shear",
  "gitleaks git --redact --no-banner .",
  "jq empty ingest/server_config.json config/telemetry_config.json",
  "sh -n ingest/entrypoint.sh",
  "sh -n scripts/sqlx-metadata.sh",
  "sh -n scripts/image-check.sh",
  "scripts/vuln-premise-test.sh",
  "! git ls-files | grep -E '^(\\.env|secrets/|\\.bin/)'",
]

[tasks.sqlx-check]
description = "Check the committed SQLx query metadata against a migrated, isolated test database"
run = "scripts/sqlx-metadata.sh check"

[tasks.sqlx-prepare]
description = "Write the SQLx query metadata in .sqlx/ after a query or migration change"
run = "scripts/sqlx-metadata.sh prepare"

[tasks.verify]
description = "Run every required local check; stops at the first failure"
run = [
  "test -n \"${TEST_DATABASE_URL:-}\" || { echo 'verify: TEST_DATABASE_URL is not set. Export the URL of the Neon branch test (README.md, Verification).' >&2; exit 1; }",
  { task = "checks" },
  { task = "sqlx-check" },
  { task = "build" },
  { task = "test" },
]

[tasks.ci]
description = "Run the checks of the GitHub Actions workflow; stops at the first failure"
# The same checks as `verify`, but the tests that need a database do not
# run (STACK.md §3). `ci` does not replace the local `verify`.
run = [
  { task = "checks" },
  { task = "build" },
  { task = "test-without-database" },
]

[tasks.image-check]
description = "Build the ingest image and check the running container (needs Docker; the CI job image-check runs it)"
# STACK.md §3. The development machine has no container runtime, so this
# task runs in CI on linux/amd64. It pushes no image and uses no secret.
run = "scripts/image-check.sh"

[tasks.deps]
description = "Dependency freshness check (STACK.md §3); reads crates.io, the Rust release channel, the image tags, and the tags of the CI pins"
run = [
  # `--verbose` lists each locked crate that is behind its latest crates.io
  # release, also across major versions: "Unchanged <crate> (available: <latest>)".
  "cargo update --dry-run --verbose",
  "mise outdated --bump --no-global",
  "echo \"pinned Rust: $(grep '^channel' rust-toolchain.toml)\"",
  "curl -fsS https://static.rust-lang.org/dist/channel-rust-stable.toml | grep -A1 '^\\[pkg.rust\\]'",
  # Images of ingest/Dockerfile: the pinned FROM lines, the newest upstream
  # release tag, the newest Rust builder tag on the Debian release of the
  # final stage, and the current Debian stable release. crane reads its
  # credentials from $DOCKER_CONFIG/config.json when that file exists. An
  # empty config.json in a temporary directory makes the read anonymous.
  "awk '/^FROM/ { print \"pinned image: \" $2 }' ingest/Dockerfile",
  # An unreadable tag list fails the task: a missing check is not a pass.
  "work=\"$(mktemp -d)\"; printf '{}' > \"$work/config.json\"; tag=\"$(DOCKER_CONFIG=\"$work\" crane ls tesla/fleet-telemetry | grep -E '^v[0-9]+[.][0-9]+[.][0-9]+$' | sort -V | tail -1)\"; rm -rf \"$work\"; test -n \"$tag\" || { echo 'deps: cannot read the tesla/fleet-telemetry tags'; exit 1; }; echo \"latest tesla/fleet-telemetry tag: $tag\"",
  # The builder tag is <Rust version>-slim-<Debian codename> (vuln task).
  "codename=\"$(sed -n 's/^FROM debian:\\([a-z]*\\).*$/\\1/p' ingest/Dockerfile)\"; test -n \"$codename\" || { echo 'deps: cannot read the Debian codename of ingest/Dockerfile'; exit 1; }; work=\"$(mktemp -d)\"; printf '{}' > \"$work/config.json\"; tag=\"$(DOCKER_CONFIG=\"$work\" crane ls rust | grep -E \"^[0-9]+[.][0-9]+[.][0-9]+-slim-$codename\\$\" | sort -V | tail -1)\"; rm -rf \"$work\"; test -n \"$tag\" || { echo 'deps: cannot read the rust image tags'; exit 1; }; echo \"latest rust builder tag: $tag\"",
  "curl -fsS https://deb.debian.org/debian/dists/stable/Release | grep -E '^(Codename|Version):'",
  # Pins of the CI workflow (STACK.md §15): each action, the mise version,
  # and the runner label, with the newest release tags. git ls-remote reads
  # the public tags; no token is needed. The step fails when it cannot read a tag
  # list, or when an action SHA is not the commit of its tag comment.
  # The workflow check is a strict allowlist, not a YAML parser (like the
  # Dockerfile check of `vuln`):
  # - `.github/` holds only `workflows/` and `pull_request_template.md`,
  #   and `.github/workflows/` holds only `ci.yml`. A new workflow file or
  #   a new directory (for example a composite action in
  #   `.github/actions/`) fails until this check covers it in the same PR.
  # - In `ci.yml`, each line with a `uses`, `version`, or `runs-on` key
  #   must have the one allowed form. A line with a `container`,
  #   `services`, or `image` key always fails (no container image is
  #   allowed yet). Each mise action step must have a `version` input,
  #   each job must have one `runs-on`, and YAML anchors and aliases are
  #   not allowed.
  # Anything else fails, and the check must change together with the
  # workflow. Limits: STACK.md §3, "Dependency freshness check".
  '''
  workflow=.github/workflows/ci.yml
  export GIT_TERMINAL_PROMPT=0
  status=0
  fix="Update the CI pin step of the deps task (mise.toml) together with the workflow."
  tags() { git ls-remote --tags "https://github.com/$1"; }
  newest() { sed -n 's#^[0-9a-f]*[[:space:]]refs/tags/\(v[0-9]*[.][0-9]*[.][0-9]*\)$#\1#p' | sort -V | tail -1; }
  [ -f "$workflow" ] || { echo "deps: $workflow is missing"; exit 1; }
  # Only the known entries in .github/ and .github/workflows/.
  extra="$(find .github -mindepth 1 -maxdepth 1 ! -name workflows ! -name pull_request_template.md; find .github/workflows -mindepth 1 ! -path "$workflow")"
  if [ -n "$extra" ]; then
    printf '%s\n' "$extra" | while IFS= read -r entry; do
      echo "deps: unexpected entry $entry"
    done
    echo "deps: .github/ may hold only workflows/ci.yml and pull_request_template.md. GitHub runs every workflow file in .github/workflows/, and the CI pin check reads only $workflow. Extend the CI pin step of the deps task (mise.toml) in the same PR as a new workflow file, action, or other entry."
    status=1
  fi
  uses_form=' +- uses: [a-z0-9-]+/[a-z0-9._-]+@[0-9a-f]{40} # v[0-9]+[.][0-9]+[.][0-9]+'
  version_form=' +version: [0-9]+[.][0-9]+[.][0-9]+'
  runs_form=' +runs-on: ubuntu-[0-9]+[.]04'
  # Every line with one of the keys (also quoted, also without "- ") and
  # every anchor or alias must be an allowed line. The keys container,
  # services, and image have no allowed form.
  bad="$(grep -nE '(uses|version|runs-on|container|services|image).?[[:space:]]*:|^[^#]*[&*][A-Za-z0-9_-]' "$workflow" |
    grep -vE "^[0-9]+:($uses_form|$version_form|$runs_form)$" | sed 's/^\([0-9]*\):/\1: /' || true)"
  if [ -n "$bad" ]; then
    printf '%s\n' "$bad" | while IFS= read -r line; do
      echo "deps: $workflow line $line"
    done
    echo "deps: the lines above are outside the allowlist. Allowed: '- uses: <owner>/<repo>@<40 lowercase hex> # vX.Y.Z' (a full release tag), 'version: X.Y.Z' (the mise action input), and 'runs-on: ubuntu-NN.04'. No container, services, or image key is allowed. $fix"
    status=1
  fi
  # Each mise action step: the next two lines are "with:" and "version:".
  if ! awk '
    want && NR == want + 1 && $0 !~ /^ +with:$/ { bad = 1 }
    want && NR == want + 2 { if ($0 !~ /^ +version: /) bad = 1; want = 0 }
    /^ +- uses: jdx\/mise-action@/ { want = NR; steps++ }
    /^ +version: / { versions++ }
    END { exit (bad || want || steps == 0 || versions != steps) }' "$workflow"; then
    echo "deps: each jdx/mise-action step of $workflow needs 'with:' and 'version: X.Y.Z' on the next two lines, and no other 'version:' line may exist. $fix"
    status=1
  fi
  # Each job has exactly one runs-on line.
  jobs="$(awk '/^jobs:$/ { j = 1; next } j && /^[^ #]/ { j = 0 } j && /^  [A-Za-z0-9_-]+:$/ { n++ } END { print n + 0 }' "$workflow")"
  runs="$(grep -cE "^$runs_form$" "$workflow" || true)"
  if [ "$jobs" -eq 0 ] || [ "$runs" -ne "$jobs" ]; then
    echo "deps: $workflow has $jobs jobs and $runs allowed runs-on lines; each job needs one. $fix"
    status=1
  fi
  pins="$(sed -n 's/^ *- uses: \([^ ]*@[0-9a-f]\{40\}\) # \(v[0-9.]*\)$/\1#\2/p' "$workflow" | sort -u)"
  [ -n "$pins" ] || { echo "deps: no pinned action in $workflow"; status=1; }
  for pin in $pins; do
    ref="${pin%%#*}"; tag="${pin#*#}"
    repo="${ref%@*}"; sha="${ref#*@}"
    list="$(tags "$repo")" || list=""
    latest="$(printf '%s\n' "$list" | newest)"
    # An annotated tag has a ^{} line with the commit; a lightweight tag has none.
    tag_sha="$(printf '%s\n' "$list" | awk -v t="refs/tags/$tag" '$2 == t "^{}" { c = $1 } $2 == t && c == "" { l = $1 } END { print (c != "" ? c : l) }')"
    if [ -z "$latest" ] || [ -z "$tag_sha" ]; then
      echo "deps: cannot read the tags of $repo"; status=1; continue
    fi
    echo "pinned action: $repo $tag ($sha); latest tag: $latest"
    [ "$tag_sha" = "$sha" ] || { echo "deps: $repo pins $sha, but $tag is $tag_sha"; status=1; }
  done
  mise_pin="$(sed -n 's/^ *version: \([0-9.]*\)$/\1/p' "$workflow" | sort -u)"
  mise_latest="$(tags jdx/mise | newest)"
  if [ -z "$mise_latest" ] || [ "$(printf '%s\n' "$mise_pin" | grep -c .)" -ne 1 ]; then
    echo "deps: cannot read the mise pin of $workflow or the mise tags"; status=1
  else
    echo "pinned CI mise: $mise_pin; latest tag: ${mise_latest#v}"
  fi
  runners="$(sed -n 's/^ *runs-on: //p' "$workflow" | sort -u | paste -sd ' ' -)"
  ubuntu="$(tags actions/runner-images | sed -n 's#.*refs/tags/ubuntu\([0-9][0-9]\)/.*#\1#p' | sort -n | tail -1)"
  if [ -z "$ubuntu" ]; then
    echo "deps: cannot read the runner image tags"; status=1
  else
    echo "pinned CI runner: $runners; newest Ubuntu runner image with a tag: $ubuntu.04 (check its status in the runner-images README)"
  fi
  exit "$status"
  ''',
]

[tasks.vuln]
description = "Vulnerability check (STACK.md §3): Rust dependencies and the runtime FROM images of ingest/Dockerfile"
# Runs every scan and fails when one scan fails or finds a vulnerability.
# crane downloads each runtime FROM image for linux/amd64 as a Docker
# archive, so no container runtime is needed. crane reads its credentials
# from $DOCKER_CONFIG/config.json when that file exists. The task points
# DOCKER_CONFIG at a temporary directory with an empty config.json, so the
# pulls are anonymous and the local credential files are not read.
# Each image scan reads the reviewed ignore file
# docs/security/osv-scanner-<repository with / as ->.toml. The entries rely
# on premises of ingest/Dockerfile, ingest/entrypoint.sh, and
# ingest/server_config.json (docs/security/image-advisories.md). The task
# checks these premises first and fails when one breaks, so that the
# triage is done again.
# The builder image (FROM rust:... AS build) is not scanned: no file of it
# reaches the final image except the ingest binary (STACK.md §13). The
# allowlist pins its tag to rust-toolchain.toml and to the Debian release
# of the final stage.
# The script is a TOML literal string: backslashes reach the shell as written.
run = '''
status=0
dockerfile=ingest/Dockerfile
entrypoint=ingest/entrypoint.sh
# Dockerfile premise: a strict allowlist, not a parser. The instruction
# lines must equal the expected lines of this project. Only the three image
# tags may change. Any other change fails, and the allowlist below must be
# updated in the same change as the Dockerfile, with a new triage.
dockerfile_fail() {
  echo "vuln: $1. Update the Dockerfile allowlist of the vuln task (mise.toml) and docs/security/image-advisories.md together with $dockerfile."
  status=1
}
if LC_ALL=C grep -q "$(printf '[^\t -~]')" "$dockerfile"; then
  dockerfile_fail "the Dockerfile has a byte outside printable ASCII, tab, and newline"
fi
if grep -qiE '^#[[:space:]]*[a-z]+[[:space:]]*=' "$dockerfile"; then
  dockerfile_fail "the Dockerfile has a parser directive (# name=value)"
fi
instructions="$(grep -vE '^(#.*)?$' "$dockerfile" || true)"
rust_tag="$(printf '%s\n' "$instructions" | sed -n '1s/^FROM rust:\([A-Za-z0-9._-]*\) AS build$/\1/p')"
upstream_tag="$(printf '%s\n' "$instructions" | sed -n '11s/^FROM tesla\/fleet-telemetry:\([A-Za-z0-9._-]*\) AS upstream$/\1/p')"
base_tag="$(printf '%s\n' "$instructions" | sed -n '12s/^FROM debian:\([A-Za-z0-9._-]*\)$/\1/p')"
expected="$(printf '%s\n' \
  "FROM rust:$rust_tag AS build" \
  'WORKDIR /build' \
  'ENV SQLX_OFFLINE=true' \
  'COPY Cargo.toml Cargo.lock ./' \
  'COPY .cargo .cargo' \
  'COPY crates crates' \
  'COPY db db' \
  'COPY migrations migrations' \
  'COPY .sqlx .sqlx' \
  'RUN cargo build --release --locked -p ingest' \
  "FROM tesla/fleet-telemetry:$upstream_tag AS upstream" \
  "FROM debian:$base_tag" \
  'RUN apt-get update \' \
  '    && DEBIAN_FRONTEND=noninteractive apt-get upgrade -y \' \
  '    && apt-get install -y --no-install-recommends ca-certificates libstdc++6 \' \
  '    && rm -rf /var/lib/apt/lists/*' \
  'COPY --from=upstream /fleet-telemetry /fleet-telemetry' \
  'COPY --from=build /build/target/release/ingest /usr/local/bin/ingest' \
  'COPY ingest/server_config.json /etc/fleet-telemetry/config.json' \
  'COPY ingest/entrypoint.sh /entrypoint.sh' \
  'RUN chmod 0755 /entrypoint.sh \' \
  '    && install -d -m 0700 -o 10001 -g 10001 /etc/fleet-telemetry/tls' \
  'ENV INGEST_GATE_PORT=4443' \
  'ENV INGEST_UPSTREAM_PORT=4444' \
  'ENV INGEST_ZMQ_PORT=5284' \
  'ENV INGEST_METRICS_PORT=9090' \
  'ENV INGEST_CHILD_PROGRAM=/fleet-telemetry' \
  'ENV INGEST_CHILD_CONFIG=/etc/fleet-telemetry/config.json' \
  'USER 10001:10001' \
  'EXPOSE 4443' \
  'CMD ["/entrypoint.sh"]')"
if [ -z "$rust_tag" ] || [ -z "$upstream_tag" ] || [ -z "$base_tag" ] || [ "$instructions" != "$expected" ]; then
  dockerfile_fail "the instruction lines of the Dockerfile differ from the allowlist"
fi
# The builder runs the Rust version of rust-toolchain.toml on the Debian
# release of the final stage, so that the binary links against the glibc
# of the final image.
channel="$(sed -n 's/^channel = "\([0-9.]*\)"$/\1/p' rust-toolchain.toml)"
if [ -z "$channel" ] || [ "$rust_tag" != "$channel-slim-${base_tag%%-*}" ]; then
  dockerfile_fail "the builder tag rust:$rust_tag is not <channel of rust-toolchain.toml>-slim-<Debian codename of the final stage>"
fi
images=""
if [ -n "$upstream_tag" ] && [ -n "$base_tag" ]; then
  images="tesla/fleet-telemetry:$upstream_tag debian:$base_tag"
fi
# The server reads the config that the Dockerfile copies: the allowlist
# above fixes the copy and INGEST_CHILD_CONFIG, ingest starts the server
# with -config and that path (crates/ingest/src/child.rs), and the
# entrypoint starts ingest run and nothing else. Entrypoint premise: a
# strict allowlist like the Dockerfile check. The first line is the
# shebang #!/bin/sh; after removal of empty lines and of lines that start
# with #, the lines must equal the expected lines; printable ASCII only.
entrypoint_fail() {
  echo "vuln: $1. Update the entrypoint allowlist of the vuln task (mise.toml) together with $entrypoint."
  status=1
}
if LC_ALL=C grep -q "$(printf '[^\t -~]')" "$entrypoint"; then
  entrypoint_fail "$entrypoint has a byte outside printable ASCII, tab, and newline"
fi
if [ "$(sed -n '1p' "$entrypoint")" != '#!/bin/sh' ]; then
  entrypoint_fail "the first line of $entrypoint is not #!/bin/sh"
fi
entrypoint_lines="$(grep -vE '^(#.*)?$' "$entrypoint" || true)"
expected_entrypoint="$(cat <<'EOF'
set -eu
: "${TLS_CERT:?Set TLS_CERT to the full certificate chain in PEM format}"
: "${TLS_KEY:?Set TLS_KEY to the private key in PEM format}"
umask 077
printf '%s\n' "$TLS_CERT" > /etc/fleet-telemetry/tls/tls.crt
printf '%s\n' "$TLS_KEY" > /etc/fleet-telemetry/tls/tls.key
unset TLS_CERT TLS_KEY MIGRATION_DATABASE_URL
if ! ulimit -S -n "$(ulimit -H -n)"; then
  echo '{"level":"WARN","message":"entrypoint_open_file_limit_not_raised"}' >&2
fi
exec /usr/local/bin/ingest run
EOF
)"
if [ "$entrypoint_lines" != "$expected_entrypoint" ]; then
  entrypoint_fail "the lines of $entrypoint differ from the allowlist"
fi
# fleet-telemetry decodes its config with Go encoding/json: keys match
# without letter case, a repeated key decodes again into the same field (a
# repeated object merges into the first one), and only the first JSON value
# of the file counts. jq is case sensitive and keeps only the last of two
# equal keys. So the check requires lowercase keys, exactly one JSON value,
# and the same leaf paths in the token stream and in the parsed value; a
# repeated key of any kind breaks the last rule.
# The zmq dispatcher makes libzmq 4.3.4 listen. Its address must be the
# literal loopback address 127.0.0.1, so that no other host can connect
# (docs/security/image-advisories.md, "Static C libraries").
config=ingest/server_config.json
if ! jq -e '
  def lower_keys: keys | all(test("^[a-z0-9_]+$"));
  lower_keys
  and ((.monitoring // {}) | lower_keys)
  and ((.tls // {}) | lower_keys)
  and ((.zmq // {}) | lower_keys)
  and (.zmq == null or ((.zmq.addr // "") | test("^tcp://127\\.0\\.0\\.1:[0-9]+$")))
  and ([(.records // {}) | .[][]] | all(. == "logger" or . == "zmq"))
  and ((.use_default_eng_ca // false) == false)
  and ((.tls.ca_file // "") == "")
  and ((.status_port // 0) == 0)
  and ((.monitoring.profiler_port // 0) == 0)
  and ((.monitoring.prometheus_metrics_host // "127.0.0.1") == "127.0.0.1")
' "$config" > /dev/null ||
  ! jq -s -e 'length == 1' "$config" > /dev/null ||
  [ "$(jq -n -c --stream '[inputs | select(length == 2) | .[0]] | sort' "$config")" != \
    "$(jq -c '[path(.. | select((type != "object" and type != "array") or length == 0))] | sort' "$config")" ]; then
  echo "vuln: $config breaks a premise of the ignore files (key case, one JSON value, repeated keys, dispatchers, client CAs, listeners, or the zmq address)"
  status=1
fi
cargo deny --locked check advisories || status=1
osv-scanner scan source -r . || status=1
work="$(mktemp -d)"
trap 'rm -rf "$work"' EXIT
printf '{}' > "$work/config.json"
export DOCKER_CONFIG="$work"
scanned=0
for image in $images; do
  echo "image: $image"
  if crane pull --platform linux/amd64 "$image" "$work/image.tar"; then
    crane digest --platform linux/amd64 "$image"
    ignore_file="docs/security/osv-scanner-$(printf '%s' "${image%%[:@]*}" | tr '/' '-').toml"
    if [ -f "$ignore_file" ]; then
      osv-scanner scan image --config "$ignore_file" --archive "$work/image.tar" || status=1
    else
      echo "vuln: no reviewed ignore file $ignore_file for $image"
      osv-scanner scan image --archive "$work/image.tar" || true
      status=1
    fi
    scanned=$((scanned + 1))
  else
    echo "vuln: cannot download $image"
    status=1
  fi
  rm -f "$work/image.tar"
done
if [ "$scanned" -ne 2 ]; then
  echo "vuln: scanned $scanned images, but the Dockerfile allowlist has 2 runtime FROM lines"
  status=1
fi
echo "vuln: not scanned: the builder image rust:$rust_tag (STACK.md §13)"
exit "$status"
'''
